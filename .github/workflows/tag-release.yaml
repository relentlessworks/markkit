name: Tag & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'

permissions:
  contents: write

jobs:
  tag-and-release:
    name: Tag & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=v$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse --verify refs/tags/${{ steps.version.outputs.version }} >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-compile
        if: steps.check_tag.outputs.exists == 'false'
        strategy:
          matrix:
            goos: [linux, darwin, windows]
            goarch: [amd64, arm64]
            exclude:
              - goos: windows
                goarch: arm64
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/markkit-${{ matrix.goos }}-${{ matrix.goarch }}${ext} ./cmd/markkit
          cd dist
          tar -czf markkit-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz markkit-${{ matrix.goos }}-${{ matrix.goarch }}${ext} ../README.md

      - name: Package artifacts
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          mkdir -p release
          cp dist/*.tar.gz release/
          cd release
          sha256sum *.tar.gz > checksums.txt

      - name: Create release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release/*
